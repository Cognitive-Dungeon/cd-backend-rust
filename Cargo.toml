[workspace]
resolver = "2"
members = ["crates/shared/*", "crates/game/*", "crates/server/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Vyacheslav Ivanov <pugemon03@gmail.com>"]

# ---------------- PROFILES ----------------

[profile.dev]
opt-level = 1
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# ---------------- DEPENDENCIES ----------------

[workspace.dependencies]

# local
cd-common = { path = "crates/shared/cd-common" }
cd-core = { path = "crates/shared/cd-core" }
cd-brp = { path = "crates/shared/cd-brp" }

cd-ecs = { path = "crates/game/cd-ecs" }
cd-map = { path = "crates/game/cd-map" }
cd-data = { path = "crates/game/cd-data" }
cd-engine = { path = "crates/game/cd-engine" }

cd-telemetry = { path = "crates/server/cd-telemetry" }
cd-net = { path = "crates/server/cd-net" }
cd-app = { path = "crates/server/cd-app" }

# runtime
tokio = { version = "1.49.0", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
notify = { version = "8.2.0", default-features = false, features = [
    "macos_kqueue",
] }

# errors
thiserror = "2.0.18"
anyhow = "1.0.102"

# data
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# ecs
bevy_ecs = { version = "0.18.1" }
bevy_reflect = { version = "0.18.1" }

# math
glam = "0.32.1"
rand_chacha = "0.10"

ahash = "0.8"
dashmap = "6"

# ---------------- LINTS ----------------

[workspace.lints.rust]
unsafe_code = "warn"
dead_code = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

# ---------------- FEATURES ----------------

[workspace.features]
default = ["server"]
server = []
tools = []
bench = []
