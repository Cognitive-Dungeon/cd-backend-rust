<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CD Dev Inspector</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #252526;
            --text: #d4d4d4;
            --accent: #4fc1ff;
            --border: #333;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg); color: var(--text);
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex; height: 100vh; overflow: hidden;
        }
        #game-container {
            flex: 1; display: flex; flex-direction: column;
            position: relative;
        }
        canvas {
            flex: 1; outline: none; display: block;
            background-color: #000;
        }
        /* Панель инспектора справа */
        #inspector {
            width: 350px; background: var(--panel); border-left: 1px solid var(--border);
            display: flex; flex-direction: column;
        }
        .header {
            background: #333; padding: 8px; font-weight: bold; font-size: 14px;
            border-bottom: 1px solid var(--border);
        }
        .section {
            padding: 10px; border-bottom: 1px solid var(--border);
        }
        .data-row {
            display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px;
        }
        .val { color: var(--accent); }
        /* Лог пакетов внизу инспектора */
        #net-log {
            flex: 1; overflow-y: auto; padding: 10px; font-size: 12px;
            background: #111; color: #aaa;
        }
        .log-msg { margin-bottom: 4px; border-bottom: 1px dashed #333; padding-bottom: 4px; }
        .log-in { color: #4ec9b0; }
        .log-out { color: #ce9178; }
        
        /* Оверлей состояния сверху */
        #top-bar {
            position: absolute; top: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7); padding: 5px 15px;
            display: flex; gap: 20px; font-size: 14px; pointer-events: none;
        }
        .status-dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            background: red; margin-right: 5px;
        }
        .connected { background: #89d185; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-bar">
        <div><span id="conn-dot" class="status-dot"></span><span id="conn-text">Disconnected</span></div>
        <div>Tick: <span class="val" id="ui-tick">0</span></div>
        <div>Ping: <span class="val" id="ui-ping">0ms</span></div>
        <div>Cam: <span class="val" id="ui-cam">0, 0</span></div>
    </div>
    <canvas id="screen"></canvas>
</div>

<div id="inspector">
    <div class="header">Entity Inspector</div>
    <div class="section" id="entity-info">
        <div style="color: #888; font-style: italic;">Hover over an entity...</div>
    </div>
    
    <div class="header">Controls</div>
    <div class="section">
        <div class="data-row"><span>Move</span> <span class="val">W, A, S, D</span></div>
        <div class="data-row"><span>Pan Camera</span> <span class="val">Arrows</span></div>
        <div class="data-row"><span>Center Cam</span> <span class="val">Space</span></div>
    </div>

    <div class="header">Network Log <button onclick="document.getElementById('net-log').innerHTML=''" style="float:right; font-size:10px; cursor:pointer;">Clear</button></div>
    <div id="net-log"></div>
</div>

<script>
    // --- Config ---
    const TILE_SIZE = 24;
    const WS_URL = "ws://127.0.0.1:8080/ws";

    // --- State ---
    let ws = null;
    let worldState = { tick: 0, entities: [] };
    let myGuid = null;
    let camera = { x: 0, y: 0 }; // В тайлах
    let hoverTile = { x: 0, y: 0 };
    let myPlayerPos = { x: 0, y: 0 };
    let lastPingTime = 0;

    // --- Canvas Setup ---
    const canvas = document.getElementById("screen");
    const ctx = canvas.getContext("2d");

    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        render();
    }
    window.addEventListener("resize", resize);

    // --- Network ---
    function connect() {
        logNet("Connecting to " + WS_URL + "...", "");
        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
            document.getElementById("conn-dot").classList.add("connected");
            document.getElementById("conn-text").innerText = "Connected";
            // Посылаем тестовый логин (как в протоколе cd-net)
            sendPacket("Login", { token: "dev-admin" });
        };

        ws.onclose = () => {
            document.getElementById("conn-dot").classList.remove("connected");
            document.getElementById("conn-text").innerText = "Disconnected (Reconnecting in 2s)";
            setTimeout(connect, 2000);
        };

        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            
            if (data.op === "Snapshot") {
                worldState = data.d;
                document.getElementById("ui-tick").innerText = worldState.tick;
                
                // Ищем себя, чтобы центрировать камеру (пока у нас нет явного MyGuid с сервера, берем первую @)
                const player = worldState.entities.find(e => e.glyph === '@');
                if (player) {
                    myPlayerPos.x = player.x;
                    myPlayerPos.y = player.y;
                    myGuid = player.guid;
                }
                render();
            } else {
                logNet("IN", msg.data, true);
            }
        };
    }

    function sendPacket(op, payload) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const packet = JSON.stringify({ op: op, d: payload });
        ws.send(packet);
        logNet("OUT", packet, false);
    }

    // --- Rendering ---
    function render() {
        // Очистка
        ctx.fillStyle = "#0e0e0e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Центр экрана (в пикселях)
        const centerX = Math.floor(canvas.width / 2);
        const centerY = Math.floor(canvas.height / 2);

        // Вычисляем смещение камеры (пиксели)
        const offsetX = centerX - (camera.x * TILE_SIZE) - (TILE_SIZE/2);
        const offsetY = centerY - (camera.y * TILE_SIZE) - (TILE_SIZE/2);

        // 1. Отрисовка сетки (для дебага)
        ctx.strokeStyle = "#222";
        ctx.lineWidth = 1;
        
        // Рисуем видимые линии
        const startCol = Math.floor(-offsetX / TILE_SIZE);
        const endCol = startCol + Math.ceil(canvas.width / TILE_SIZE) + 1;
        const startRow = Math.floor(-offsetY / TILE_SIZE);
        const endRow = startRow + Math.ceil(canvas.height / TILE_SIZE) + 1;

        ctx.beginPath();
        for (let x = startCol; x <= endCol; x++) {
            ctx.moveTo(x * TILE_SIZE + offsetX, 0);
            ctx.lineTo(x * TILE_SIZE + offsetX, canvas.height);
        }
        for (let y = startRow; y <= endRow; y++) {
            ctx.moveTo(0, y * TILE_SIZE + offsetY);
            ctx.lineTo(canvas.width, y * TILE_SIZE + offsetY);
        }
        ctx.stroke();

        // Выделение оси 0,0
        ctx.strokeStyle = "#444";
        ctx.strokeRect(offsetX, offsetY, TILE_SIZE, TILE_SIZE);

        // 2. Подсветка тайла под мышкой
        ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
        ctx.fillRect(hoverTile.x * TILE_SIZE + offsetX, hoverTile.y * TILE_SIZE + offsetY, TILE_SIZE, TILE_SIZE);

        // 3. Отрисовка Entity
        ctx.font = `bold ${TILE_SIZE * 0.8}px Consolas`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (const ent of worldState.entities) {
            const px = ent.x * TILE_SIZE + offsetX + TILE_SIZE/2;
            const py = ent.y * TILE_SIZE + offsetY + TILE_SIZE/2;

            ctx.fillStyle = ent.color || "#FFF";
            ctx.fillText(ent.glyph, px, py);
            
            // Если это мышка над сущностью, рисуем рамочку
            if (ent.x === hoverTile.x && ent.y === hoverTile.y) {
                ctx.strokeStyle = "#ffcc00";
                ctx.strokeRect(ent.x * TILE_SIZE + offsetX, ent.y * TILE_SIZE + offsetY, TILE_SIZE, TILE_SIZE);
                updateInspector(ent);
            }
        }
    }

    // --- Input & Interactivity ---
    canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const centerX = Math.floor(canvas.width / 2);
        const centerY = Math.floor(canvas.height / 2);
        const offsetX = centerX - (camera.x * TILE_SIZE) - (TILE_SIZE/2);
        const offsetY = centerY - (camera.y * TILE_SIZE) - (TILE_SIZE/2);

        hoverTile.x = Math.floor((mouseX - offsetX) / TILE_SIZE);
        hoverTile.y = Math.floor((mouseY - offsetY) / TILE_SIZE);
        
        render(); // Перерисовываем для эффекта ховера
    });

    window.addEventListener("keydown", (e) => {
        // Управление игроком (отправляем на сервер)
        // Команды отправляют АБСОЛЮТНЫЕ координаты (как ждет сервер cd-net)
        let dx = 0, dy = 0;
        if (e.key === "w" || e.key === "W") dy = -1;
        if (e.key === "s" || e.key === "S") dy = 1;
        if (e.key === "a" || e.key === "A") dx = -1;
        if (e.key === "d" || e.key === "D") dx = 1;

        if (dx !== 0 || dy !== 0) {
            sendPacket("Move", { 
                x: myPlayerPos.x + dx, 
                y: myPlayerPos.y + dy 
            });
        }

        // Управление камерой (локально)
        if (e.key === "ArrowUp") camera.y -= 1;
        if (e.key === "ArrowDown") camera.y += 1;
        if (e.key === "ArrowLeft") camera.x -= 1;
        if (e.key === "ArrowRight") camera.x += 1;
        if (e.key === " ") { camera.x = myPlayerPos.x; camera.y = myPlayerPos.y; } // Space = центрировать

        document.getElementById("ui-cam").innerText = `${camera.x}, ${camera.y}`;
        render();
    });

    // --- Utils ---
    function updateInspector(ent) {
        const html = `
            <div class="data-row"><span>GUID:</span> <span class="val">${ent.guid}</span></div>
            <div class="data-row"><span>Position:</span> <span class="val">${ent.x}, ${ent.y}</span></div>
            <div class="data-row"><span>Glyph:</span> <span class="val" style="color:${ent.color}">${ent.glyph}</span></div>
            <div class="data-row"><span>Color:</span> <span class="val">${ent.color}</span></div>
        `;
        document.getElementById("entity-info").innerHTML = html;
    }

    function logNet(dir, msg, isIn) {
        const log = document.getElementById("net-log");
        const div = document.createElement("div");
        div.className = "log-msg " + (isIn ? "log-in" : "log-out");
        const time = new Date().toISOString().split('T')[1].slice(0,-1);
        div.innerText = `[${time}] ${dir}: ${msg}`;
        log.appendChild(div);
        if (log.childNodes.length > 50) log.removeChild(log.firstChild);
        log.scrollTop = log.scrollHeight;
    }

    // --- Init ---
    resize();
    connect();
</script>
</body>
</html>
